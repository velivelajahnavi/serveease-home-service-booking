spring.application.name=serveease-backend
server.port=8080

# Loads local secrets automatically if present (ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/serveease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ServeEaseSuperSecretJwtKeyForLocalDevelopmentOnlyChangeInProd2026!}
app.jwt.expiration-ms=86400000

# Frontend URL (CORS & OAuth2 Redirect)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google OAuth2.0 (Optional - plug in real credentials via env vars or application-local.properties)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email